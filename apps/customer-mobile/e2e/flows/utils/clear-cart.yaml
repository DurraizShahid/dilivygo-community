# Utility - Clear Cart
# Clears all items from cart

appId: com.dilivygo.customer
name: "Utility - Clear Cart"
---

# Navigate to cart
- tapOn:
    text: "Cart"

- extendedWaitUntil:
    visible: ".*"
    timeout: 5000

# Remove items if cart has items
- runFlow:
    when:
      notVisible: "empty|no items"
      regex: true
    commands:
      - repeat:
          times: 5
          commands:
            - tapOn:
                text: "Remove|Delete|×|✕"
                regex: true
                optional: true
            - extendedWaitUntil:
                visible: ".*"
                timeout: 2000
