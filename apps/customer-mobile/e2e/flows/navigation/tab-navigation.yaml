# Navigation - Tab Navigation Test
# Tests the main tab bar navigation

appId: com.dilivygo.customer
name: "Navigation - Tab Bar"
tags:
  - navigation
  - tabs
---

# Launch app
- launchApp:
    clearState: true

# Wait for app to load
- extendedWaitUntil:
    visible: ".*"
    timeout: 15000

# Run login flow first to access all tabs
- runFlow:
    file: ../auth/login.yaml
    optional: true

# Screenshot of initial state
- takeScreenshot: "nav_initial"

# Navigate to Home tab
- tapOn:
    text: "Home"
    optional: true
    
- extendedWaitUntil:
    visible: ".*"
    timeout: 3000

- takeScreenshot: "nav_home_tab"

# Navigate to Cart tab
- tapOn:
    text: "Cart"
    optional: true

- extendedWaitUntil:
    visible: ".*"
    timeout: 3000
    
- takeScreenshot: "nav_cart_tab"

# Navigate to Orders tab
- tapOn:
    text: "Orders"
    optional: true

- extendedWaitUntil:
    visible: ".*"
    timeout: 3000
    
- takeScreenshot: "nav_orders_tab"

# Navigate to Chat tab
- tapOn:
    text: "Chat"
    optional: true

- extendedWaitUntil:
    visible: ".*"
    timeout: 3000
    
- takeScreenshot: "nav_chat_tab"

# Navigate to Account tab
- tapOn:
    text: "Account"
    optional: true

- extendedWaitUntil:
    visible: ".*"
    timeout: 3000
    
- takeScreenshot: "nav_account_tab"

# Return to Home
- tapOn:
    text: "Home"
    optional: true
    
- takeScreenshot: "nav_back_to_home"
