# Order Flow - View Order History
# Tests viewing past orders

appId: com.dilivygo.customer
name: "Order - View History"
tags:
  - order
  - history
---

# Launch and login
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible: ".*"
    timeout: 15000

# Ensure logged in
- runFlow:
    file: ../auth/login.yaml
    optional: true

# Navigate to Orders tab
- tapOn:
    text: "Orders"

- extendedWaitUntil:
    visible: ".*"
    timeout: 5000

- takeScreenshot: "orders_list"

# Check for order items
- runFlow:
    when:
      visible: "No orders|Empty"
      regex: true
    commands:
      - takeScreenshot: "orders_empty_state"

# If orders exist, tap on first one
- runFlow:
    when:
      notVisible: "No orders|Empty"
      regex: true
    commands:
      - tapOn:
          index: 0
          optional: true
      - extendedWaitUntil:
          visible: ".*"
          timeout: 5000
      - takeScreenshot: "order_detail"

# Scroll through order details
- scroll:
    direction: DOWN

- takeScreenshot: "order_detail_scrolled"

# Go back
- back

- extendedWaitUntil:
    visible: ".*"
    timeout: 3000

- takeScreenshot: "orders_back_to_list"
